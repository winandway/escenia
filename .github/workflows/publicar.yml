# Compila el panel y lo empuja a la rama yapanel-build, que es la que
# YaDominios Cloud tiene conectada (la plataforma no corre builds).
name: Publicar en YaDominios Cloud
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: publicar
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Comprobar el par Next / adaptador
        run: |
          RANGO=$(node -p "require('./node_modules/@opennextjs/cloudflare/package.json').peerDependencies.next")
          MIA=$(node -p "require('./node_modules/next/package.json').version")
          [ -n "$RANGO" ] && [ -n "$MIA" ] || { echo "::error::No se pudo leer las versiones."; exit 1; }
          npx --yes semver -r "$RANGO" "$MIA" >/dev/null || { echo "::error::Next $MIA no lo acepta el adaptador ($RANGO)"; exit 1; }
      - run: npx opennextjs-cloudflare build
        env:
          # El canario dice qué versión está en vivo (los 7 primeros caracteres del commit).
          NEXT_PUBLIC_VERSION: ${{ github.sha }}
      - name: Empaquetar en un solo _worker.js
        run: |
          npx wrangler deploy --dry-run --outdir=.dist-worker --minify
          node scripts/empaquetar-worker.mjs
      # El par Next / adaptador puede "cuadrar" en versiones y aun así no arrancar (Next 16.4.0 con
      # el adaptador 1.20.x reventaba al iniciar: C-DEPLOY-2). Se publica solo si el worker empaquetado
      # responde el canario.
      - name: Humo del _worker.js empaquetado
        run: |
          npx wrangler dev -c wrangler.prueba.jsonc --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://localhost:8787/datos/salud | grep -q '"estado"'; then
              echo "El worker empaquetado arranca."; exit 0
            fi
            sleep 3
          done
          echo "::error::El _worker.js empaquetado no arranca (canario sin respuesta)."
          tail -40 /tmp/wrangler-dev.log
          exit 1
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yapanel-build
          publish_dir: ./out-deploy
